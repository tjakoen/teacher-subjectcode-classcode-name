name: Publish material

# Control-panel workflow: publish a course-material unit (a branch) into every
# student repo in a section. The unit's branch name == its folder under content/.
on:
  workflow_dispatch:
    inputs:
      unit:
        description: "Unit folder under content/ to publish (e.g. m1-intro)"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ORG: ${{ github.repository_owner }}   # the course org - this repo lives in it
      GH_TOKEN: ${{ secrets.ORG_PAT }}       # fine-grained PAT: Contents+PRs+Issues write
      UNIT: ${{ github.event.inputs.unit }}
      SECTION: "CLASSCODE"                    # FILL IN: LOCKED, e.g. "0000" - this repo publishes ONLY to its class
    steps:
      - name: Checkout teacher repo (default branch)
        uses: actions/checkout@v5
        with:
          path: teacher

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Authenticate git for cross-repo pushes
        run: gh auth setup-git   # makes `git push` to student repos use ORG_PAT

      - name: Resolve target repos for the section
        id: targets
        run: |
          # The org has thousands of repos and this GraphQL query has timed out
          # with a 504 before. Without pipefail the failure was invisible: node
          # succeeded on empty input, the target list came back empty, and the
          # whole publish reported success while writing to nobody. Retry, then
          # refuse to continue on an empty list.
          set -o pipefail
          repos=""
          for attempt in 1 2 3; do
            if repos=$(gh repo list "$ORG" --limit 5000 --json name -q '.[].name' \
                 | node teacher/tools/list-section-repos.mjs "$SECTION" student-); then
              [ -n "$repos" ] && break
            fi
            echo "attempt $attempt: no repos resolved, retrying in 20s"
            sleep 20
          done
          if [ -z "$repos" ]; then
            echo "::error::No target repos resolved for section $SECTION. Refusing to report success on a publish that would reach nobody."
            exit 1
          fi
          echo "Targets for section $SECTION ($(echo "$repos" | wc -l | tr -d ' ') repos):"; echo "$repos"
          {
            echo "repos<<EOF"
            echo "$repos"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish unit into each repo
        run: |
          SRC="teacher/content/$UNIT"
          if [ ! -d "$SRC" ]; then
            echo "::error::content/$UNIT not found on branch $UNIT"; exit 1
          fi
          echo "${{ steps.targets.outputs.repos }}" | while read -r repo; do
            [ -z "$repo" ] && continue
            echo "::group::$repo"
            rm -rf work
            gh repo clone "$ORG/$repo" work -- -q
            base=$(gh repo view "$ORG/$repo" --json defaultBranchRef -q .defaultBranchRef.name)
            node teacher/tools/sync-unit.mjs "$SRC" "work/content/$UNIT"
            # Per-repo work is isolated: a failure here must never abort the
            # whole sweep, so the subshell's exit is caught and the loop goes on.
            (
              set -e
              cd work
              git config user.name "course-bot"
              git config user.email "course-bot@users.noreply.github.com"
              if [ -z "$base" ]; then
                # Empty student repo (no commits yet): publish straight to main
                # so a stray publish/ branch can't become the default branch.
                git checkout -B main
                git add content
                git diff --cached --quiet && { echo "no changes for $repo"; exit 0; }
                git commit -m ":books: Publish $UNIT"
                git push -u origin main
              else
                # Commit directly on the default branch as course-bot - no PR.
                # (The old branch+PR+merge dance attributed every PR and merge
                # commit to the ORG_PAT owner's profile, and concurrent unit
                # publishes raced each other's merges.) If something landed
                # since the clone, rebase our content-only commit and retry.
                git checkout "$base"
                git add content
                git diff --cached --quiet && { echo "no changes for $repo"; exit 0; }
                git commit -m ":books: Publish $UNIT"
                git push origin "$base" \
                  || { git pull --rebase origin "$base" && git push origin "$base"; }
              fi
            ) || echo "::warning::publish failed for $repo (continuing)"
            echo "::endgroup::"
          done
